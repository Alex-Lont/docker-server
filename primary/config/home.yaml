http:
  routers:
    proxmox:
      entryPoints:
        - "https"
      rule: Host(`proxmox.lontiotlabs.au`)
      middlewares:
        - secured
        - https-redirectscheme
      tls: {}
      service: proxmox
    truenas:
      entryPoints:
        - "https"
      rule: Host(`truenas.lontiotlabs.au`)
      middlewares:
        - secured
        - https-redirectscheme
      tls: {}
      service: truenas
    omada:
      entryPoints:
        - "https"
      rule: Host(`omada.lontiotlabs.au`)
      middlewares:
        - secured
        - https-redirectscheme
      tls: {}
      service: omada
    immich:
      entryPoints:
        - "https"
      rule: Host(`immich.lontiotlabs.au`)
      middlewares:
        - secured
        - https-redirectscheme
      tls: {}
      service: immich
    frigate:
      entryPoints:
        - "https"
      rule: Host(`frigate.lontiotlabs.au`)
      middlewares:
        - secured
        - https-redirectscheme
      tls: {}
      service: frigate

  services:
    proxmox:
      loadBalancer:
        servers:
          - url: https://10.0.14.2:8006
        passHostHeader: true
    truenas:
      loadBalancer:
        servers:
          - url: https://10.0.14.14
        passHostHeader: true
    omada:
      loadBalancer:
        servers:
          - url: https://10.0.100.2:4443
        passHostHeader: true  
    immich:
      loadBalancer:
        servers:
          - url: http://10.0.14.4:2283
        passHostHeader: true
    frigate:
      loadBalancer:
        servers:
          - url: http://10.0.14.4:5000
        passHostHeader: true