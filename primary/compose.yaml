services:
  traefik:
    image: traefik:latest
    container_name: traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
    ports:
      - 80:80
      - 443:443
    environment:
      - CF_API_EMAIL=${CF_API_EMAIL}
      - CF_API_KEY=${CF_API_KEY}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik.yml:/traefik.yml:ro
      - ./config:/config:ro
      - ./acme.json:/acme.json
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.entrypoints=http"
      - "traefik.http.routers.traefik.rule=Host(`traefik.virtual.${DOMAIN}`)"
      - "traefik.http.middlewares.traefik-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.sslheader.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.routers.traefik.middlewares=traefik-https-redirect"
      - "traefik.http.routers.traefik-secure.entrypoints=https"
      - "traefik.http.routers.traefik-secure.rule=Host(`traefik.virtual.${DOMAIN}`)"
      - "traefik.http.routers.traefik-secure.tls=true"
      - "traefik.http.routers.traefik-secure.tls.certresolver=cloudflare"
      - "traefik.http.routers.traefik-secure.tls.domains[0].main=${DOMAIN}"
      - "traefik.http.routers.traefik-secure.tls.domains[0].sans=*.${DOMAIN}"
      - "traefik.http.routers.traefik-secure.tls.domains[1].sans=*.camera.${DOMAIN}"
      - "traefik.http.routers.traefik-secure.tls.domains[2].sans=*.iot.${DOMAIN}"
      - "traefik.http.routers.traefik-secure.tls.domains[3].sans=*.virtual.${DOMAIN}"
      - "traefik.http.routers.traefik-secure.service=api@internal"

  homarr:
    container_name: homarr
    image: ghcr.io/homarr-labs/homarr:latest
    restart: unless-stopped
    volumes:
      - ./../homarr/datadata:/appdata 
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - SECRET_ENCRYPTION_KEY=${SECRET_ENCRYPTION_KEY}
      - ENABLE_DNS_CACHING=true
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.homarr.entrypoints=http
      - traefik.http.routers.homarr.rule=Host(`home.${DOMAIN}`)
      - traefik.http.middlewares.homarr-https-redirect.redirectscheme.scheme=https
      - traefik.http.routers.homarr.middlewares=homarr-https-redirect
      - traefik.http.routers.homarr-secure.entrypoints=https
      - traefik.http.routers.homarr-secure.rule=Host(`home.${DOMAIN}`)
      - traefik.http.routers.homarr-secure.tls=true
      - traefik.http.routers.homarr-secure.service=homarr
      - traefik.http.services.homarr.loadbalancer.server.port=7575
      - traefik.docker.network=proxy

  adguard:
    container_name: adguard
    image: adguard/adguardhome:latest
    restart: unless-stopped
    networks:
      - proxy
    ports:
      - 53:53/udp
      - 53:53/tcp
      - 853:853/tcp
      - 3000:3000/tcp
    volumes:
      - ${config}/adguard/work:/opt/adguardhome/work
      - ./adguard:/opt/adguardhome/conf
    labels:
      - traefik.enable=true
      - traefik.http.routers.adguard.entrypoints=http
      - traefik.http.routers.adguard.rule=Host(`dns.${DOMAIN}`)
      - traefik.http.routers.adguard.middlewares=adguard-https-redirect
      - traefik.http.middlewares.adguard-https-redirect.redirectscheme.scheme=https
      - traefik.http.routers.adguard-secure.entrypoints=https
      - traefik.http.routers.adguard-secure.rule=Host(`dns.${DOMAIN}`)
      - traefik.http.routers.adguard-secure.tls=true
      - traefik.http.routers.adguard-secure.tls.certresolver=cloudflare
      - traefik.http.routers.adguard-secure.service=adguard
      - traefik.http.services.adguard.loadbalancer.server.port=80
      - traefik.docker.network=proxy

  tududi:
    container_name: tududi
    image: chrisvel/tududi:latest
    restart: unless-stopped
    networks:
      - proxy
    environment:
      - TUDUDI_USER_NAME=admin 
      - TUDUDI_USER_EMAIL=${CF_API_EMAIL}
      - TUDUDI_USER_PASSWORD=${MYSQL_PASSWORD}
      - TUDUDI_SESSION_SECRET=${SECRET_ENCRYPTION_KEY}
    volumes:
      - ${config}/tududi/db:/app/backend/db
      - ${config}/tududi/uploads:/app/backend/uploads
    labels:
      - traefik.enable=true
      - traefik.http.routers.tududi.entrypoints=http
      - traefik.http.routers.tududi.rule=Host(`todo.${DOMAIN}`)
      - traefik.http.routers.tududi.middlewares=tududi-https-redirect
      - traefik.http.middlewares.tududi-https-redirect.redirectscheme.scheme=https
      - traefik.http.routers.tududi-secure.entrypoints=https
      - traefik.http.routers.tududi-secure.rule=Host(`todo.${DOMAIN}`)
      - traefik.http.routers.tududi-secure.tls=true
      - traefik.http.routers.tududi-secure.tls.certresolver=cloudflare
      - traefik.http.routers.tududi-secure.service=tududi
      - traefik.http.services.tududi.loadbalancer.server.port=3002
      - traefik.docker.network=proxy

  technitium:
    container_name: dns-server
    hostname: dns-server
    image: docker.io/technitium/dns-server:latest
    restart: unless-stopped
    sysctls:
      - net.ipv4.ip_local_port_range=1024 65535 #remove when using "host" network mode
    networks:
      - proxy
    # ports:
      # - 5380:5380/tcp #DNS web console (HTTP)
      # - 53:53/udp #DNS service
      # - 53:53/tcp #DNS service
      # - 853:853/udp #DNS-over-QUIC service
      # - 853:853/tcp #DNS-over-TLS service
      # - "443:443/udp" #DNS-over-HTTPS service (HTTP/3)
      # - "443:443/tcp" #DNS-over-HTTPS service (HTTP/1.1, HTTP/2)
      # - "80:80/tcp" #DNS-over-HTTP service (use with reverse proxy or certbot certificate renewal)
    environment:
      - DNS_SERVER_ADMIN_PASSWORD=password
      - DNS_SERVER_OPTIONAL_PROTOCOL_DNS_OVER_HTTP=true #Enables DNS server optional protocol DNS-over-HTTP on TCP port 8053 to be used with a TLS terminating reverse proxy like nginx.
      - DNS_SERVER_RECURSION=UseSpecifiedNetworkACL  #Recursion options: Allow, Deny, AllowOnlyForPrivateNetworks, UseSpecifiedNetworkACL.
      - DNS_SERVER_RECURSION_NETWORK_ACL=192.168.7.1/32, 192.168.10.1/32, 10.0.100.1/32, 10.0.20.1/32, 10.0.14.1/32,172.16.30.1/32 
      - DNS_SERVER_LOG_USING_LOCAL_TIME=true #Enable this option to use local time instead of UTC for logging.
      - DNS_SERVER_LOG_FOLDER_PATH=/var/log/technitium/dns #The folder path on the server where the log files should be saved.
      - DNS_SERVER_LOG_MAX_LOG_FILE_DAYS=7 #Max number of days to keep the log files. Log files older than the specified number of days will be deleted automatically. Set 0 to disable auto delete.
      - DNS_SERVER_STATS_ENABLE_IN_MEMORY_STATS=true #This option will enable in-memory stats and only Last Hour data will be available on Dashboard. No stats data will be stored on disk.
      - DNS_SERVER_STATS_MAX_STAT_FILE_DAYS=7 #Max number of days to keep the dashboard stats. Stat files older than the specified number of days will be deleted automatically. Set 0 to disable auto delete.
    volumes:
      - ${config}/technitium:/etc/dns
      - ${config}/technitium/logs:/var/log/technitium/dns
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.services.technitium-web.loadbalancer.server.port=5380
      - traefik.http.routers.technitium-http.service=technitium-web
      - traefik.http.routers.technitium-http.rule=Host(`dns-tech.${DOMAIN}`)
      - traefik.http.routers.technitium-http.entrypoints=http
      - traefik.http.routers.technitium-https.service=technitium-web
      - traefik.http.routers.technitium-https.rule=Host(`dns-tech.${DOMAIN}`)
      - traefik.http.routers.technitium-https.entrypoints=https
      - traefik.http.routers.technitium-https.tls=true
      - traefik.http.routers.technitium-https.tls.certresolver=cloudflare
      - traefik.http.services.technitium-doh.loadbalancer.server.port=80
      - traefik.http.routers.technitium-doh.service=technitium-doh
      - traefik.http.routers.technitium-doh.rule=Host(`dns-tech.${DOMAIN}`) && PathPrefix(`/dns-query`)
      - traefik.http.routers.technitium-doh.entrypoints=https
      - traefik.http.routers.technitium-doh.tls=true
      - traefik.http.routers.technitium-doh.tls.certresolver=cloudflare
      - traefik.http.routers.technitium-doh.priority=100

networks:
  proxy:
    driver: bridge