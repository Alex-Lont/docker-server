services:
  traefik:
    image: traefik:latest
    container_name: traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
    ports:
      - 80:80
      - 443:443
    environment:
      - CF_API_EMAIL=${CF_API_EMAIL}
      - CF_API_KEY=${CF_API_KEY}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./traefik.yml:/traefik.yml:ro
      - ./config:/config:ro
      - ./acme.json:/acme.json

  technitium:
    container_name: dns-server
    hostname: dns-server
    image: docker.io/technitium/dns-server:latest
    restart: unless-stopped
    sysctls:
      - net.ipv4.ip_local_port_range=1024 65535 #remove when using "host" network mode
    networks:
      - proxy
    environment:
      - DNS_SERVER_ADMIN_PASSWORD=password
      - DNS_SERVER_OPTIONAL_PROTOCOL_DNS_OVER_HTTP=true #Enables DNS server optional protocol DNS-over-HTTP on TCP port 8053 to be used with a TLS terminating reverse proxy like nginx.
      - DNS_SERVER_RECURSION=UseSpecifiedNetworkACL  #Recursion options: Allow, Deny, AllowOnlyForPrivateNetworks, UseSpecifiedNetworkACL.
      - DNS_SERVER_RECURSION_NETWORK_ACL=192.168.7.1/32, 192.168.10.1/32, 10.0.100.1/32, 10.0.20.1/32, 10.0.14.1/32,172.16.30.1/32 
      - DNS_SERVER_LOG_USING_LOCAL_TIME=true #Enable this option to use local time instead of UTC for logging.
      - DNS_SERVER_LOG_FOLDER_PATH=/var/log/technitium/dns #The folder path on the server where the log files should be saved.
      - DNS_SERVER_LOG_MAX_LOG_FILE_DAYS=7 #Max number of days to keep the log files. Log files older than the specified number of days will be deleted automatically. Set 0 to disable auto delete.
      - DNS_SERVER_STATS_ENABLE_IN_MEMORY_STATS=true #This option will enable in-memory stats and only Last Hour data will be available on Dashboard. No stats data will be stored on disk.
      - DNS_SERVER_STATS_MAX_STAT_FILE_DAYS=7 #Max number of days to keep the dashboard stats. Stat files older than the specified number of days will be deleted automatically. Set 0 to disable auto delete.
    volumes:
      - ${config:-~/config}/technitium:/etc/dns
      - ${config:-~/config}/technitium/logs:/var/log/technitium/dns

  patchmon:
    container_name: patchmon
    hostname: patchmon
    image: ghcr.io/patchmon/patchmon-server:latest
    restart: unless-stopped
    networks:
      - proxy
    environment:
      -  CORS_ORIGIN=http://localhost:3000,http://patchmon.local:3000,http://192.168.7.10:3000,https://patch.${DOMAIN}
      -  TZ=${TZ:-Australia/Melbourne}
      -  TRUST_PROXY=true
      -  JWT_SECRET=${PATCHMON_JWT_SECRET}
      -  SESSION_SECRET=${PATCHMON_SESSION_SECRET}
      -  AI_ENCRYPTION_KEY=${PATCHMON_AI_ENCRYPTION_KEY}
      -  POSTGRES_HOST=patch_db
      -  POSTGRES_PASSWORD=${PATCHMON_POSTGRES}
      -  POSTGRES_USER=patchmon
      -  POSTGRES_DB=patchmon
      -  DATABASE_URL=postgresql://patchmon:${PATCHMON_POSTGRES}@patch_db:5432/patchmon
      -  REDIS_PASSWORD=${PATCHMON_REDIS_PASSWORD}
      # -  OIDC_ENABLED=true
      # -  OIDC_ISSUER_URL=https://auth.${DOMAIN}/application/o/patch/
      # -  OIDC_CLIENT_ID=${PATCHMON_OIDC_CLIENT_ID}
      # -  OIDC_CLIENT_SECRET=${PATCHMON_OIDC_CLIENT_SECRET}
      # -  OIDC_REDIRECT_URI=https://patch.${DOMAIN}/api/v1/auth/oidc/callback
      # -  OIDC_AUTO_CREATE_USERS=true
      # -  OIDC_DEFAULT_ROLE=user
      # -  OIDC_ADMIN_GROUP=PatchMon Admins
      # -  OIDC_USER_GROUP=PatchMon Users
      # -  OIDC_SUPERADMIN_GROUP=PatchMon SuperAdmins
      # -  OIDC_HOST_MANAGER_GROUP=PatchMon Host Managers
      # -  OIDC_READONLY_GROUP=PatchMon Readonly
    depends_on:
      patch_db:
        condition: service_healthy
      redis:
        condition: service_healthy
      guacd:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  patch_db:
    container_name: patch_db
    hostname: patch_db
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: patchmon
      POSTGRES_USER: patchmon
      POSTGRES_PASSWORD: ${PATCHMON_POSTGRES}
    volumes:
      - ${config:-~/config}/patch_db:/var/lib/postgresql/data
    networks:
      - proxy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U patchmon -d patchmon"]
      interval: 3s
      timeout: 5s
      retries: 7
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    container_name: redis
    hostname: redis
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${PATCHMON_REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${PATCHMON_REDIS_PASSWORD}", "ping"]
      interval: 3s
      timeout: 5s
      retries: 7
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  guacd:
    image: guacamole/guacd:1.6.0
    hostname: guacd
    container_name: guacd
    read_only: true
    restart: unless-stopped
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cpus: '1.0'
    networks:
      - proxy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 4822 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  keycloak:
    image: quay.io/keycloak/keycloak:23.0.7
    hostname: keycloak
    container_name: keycloak
    restart: unless-stopped
    command: start-dev
    networks:
      - proxy
    ports:
      - 8080:8080
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    depends_on:
      keycloak_db:
        condition: service_healthy

  keycloak_db:
    container_name: keycloak_db
    hostname: keycloak_db
    image: postgres:17-alpine
    restart: unless-stopped
    networks:
      - proxy
    volumes:
      - ${config:-~/config}/keycloak_db:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 3s
      timeout: 5s
      retries: 7

volumes:
  redis_data:

networks:
  proxy:
    driver: bridge