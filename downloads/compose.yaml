services:
  qbittorrent:
    image: dyonr/qbittorrentvpn:latest
    container_name: qbittorrentvpn
    privileged: true
    networks:
      - docker
    environment:
      - VPN_ENABLED=yes
      - VPN_TYPE=openvpn
      - VPN_USERNAME=${VPN_USERNAME}
      - VPN_PASSWORD=${VPN_PASSWORD}
      - NAME_SERVERS=1.1.1.1,9.9.9.9
      - ENABLE_SSL=no
      - LAN_NETWORK=${LAN_NETWORK}, ${HOME_NETWORK}
      - PUID=${PUID}
      - PGID=${PGID}
      - HEALTH_CHECK_HOST=one.one.one.one
      - HEALTH_CHECK_INTERVAL=300
      - HEALTH_CHECK_SILENT=1
      - RESTART_CONTAINER=yes
      - UMASK=0022
    volumes:
      - ${config:-~/config}/qBittorrent:/config
      - ${downloads}:/downloads 
    ports:
      - 8080:8080
      - 8999:8999
      - 8999:8999/udp
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "! tail -n 15 /config/qBittorrent/data/logs/qbittorrent.log | grep -q 'Caught signal: SIGSEGV'"]
      interval: 60s
      timeout: 10s
      retries: 1
      start_period: 60s

  jackett:
    image: dyonr/jackettvpn:latest
    container_name: jackett
    privileged: true
    networks:
      - docker
    environment:
      - VPN_ENABLED=YES
      - VPN_TYPE=openvpn
      - VPN_USERNAME=${VPN_USERNAME}
      - VPN_PASSWORD=${VPN_PASSWORD}
      - LAN_NETWORK=${LAN_NETWORK}, ${HOME_NETWORK}
      - PGID=${PGID:-1000}
      - PUID=${PUID:-1000}
    volumes:
      - ${config:-~/config}/jackett:/config
      - ${config:-~/config}/jackett/blackhole:/blackhole
    ports:
      - 9117:9117
    restart: unless-stopped

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    hostname: flaresolverr
    networks:
      - docker
    environment:
      - LOG_LEVEL=info
      - TZ=${TZ:-Australia/Melbourne}
    ports:
      - 8191:8191
    restart: unless-stopped 

  radarr:
    image: linuxserver/radarr:latest
    container_name: radarr
    networks:
      - docker
    environment:
      - TZ=${TZ:-Australia/Melbourne}
      - PGID=${PGID:-1000}
      - PUID=${PUID:-1000}
    volumes:
      - ${config:-~/config}/radarr:/config
      - ${movies}:/movies
      - ${downloads}:/downloads
    ports:
      - 7878:7878
    restart: unless-stopped

  sonarr:
    image: linuxserver/sonarr:latest
    container_name: sonarr
    networks:
      - docker
    environment:
        - TZ=${TZ:-Australia/Melbourne}
        - PGID=${PGID:-1000}
        - PUID=${PUID:-1000}
    volumes:
      - ${config:-~/config}/sonarr:/config
      - ${tv}:/tv
      - ${downloads}:/downloads
    ports:
      - 8989:8989
    restart: unless-stopped

  bazarr:
    image: linuxserver/bazarr
    container_name: bazarr
    networks:
      - docker
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Australia/Melbourne}
    volumes:
      - ${config:-~/config}/bazarr:/config
      - ${tv}:/tv
      - ${movies}:/movies
    ports:
      - 6767:6767
    restart: unless-stopped

networks:
  docker:
    driver: bridge