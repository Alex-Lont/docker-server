http:
  middlewares:
    https-redirectscheme:
      redirectScheme:
        scheme: https
        permanent: true

    default-headers:
      headers:
        frameDeny: true
        browserXssFilter: true
        contentTypeNosniff: true
        forceSTSHeader: true
        stsIncludeSubdomains: true
        stsPreload: true
        stsSeconds: 15552000
        customFrameOptionsValue: SAMEORIGIN
        customRequestHeaders:
          X-Forwarded-Proto: https

    default-whitelist:
      ipWhiteList:
        sourceRange:
        - 10.0.100.1/28
        - 192.168.7.1/24
        - 192.168.10.1/24
        - 10.0.20.1/28
        - 10.0.14.1/28
        - 172.168.0.1/28
        - 127.0.0.1/8

    secured:
      chain:
        middlewares:
        - default-whitelist
        - default-headers